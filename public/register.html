<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oaktree Registration</title>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"> 
    
    <script defer src="script.js"></script> 
</head>
<body>
    
    <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-trigger">
            MENU
        </div>
        <ul>
            <a href="login.html">LOGIN</a>
        </ul>  
    </nav>

    <div class="registration-container">
        <div class="registration-card">
            <h1>Oaktree Registration</h1>
            <p class="tagline">Join the community and start connecting!</p>

            <form class="form" id="regForm">
                <div class="input-group">
                    <label for="username">Enter Username Here:</label>
                    <input type="text" id="username" placeholder="Required">
                </div>
                
                <div class="input-group">
                    <label for="userEmail">Enter Email Here:</label>
                    <input type="email" id="userEmail" placeholder="Required">
                </div>
                
                <div class="input-group">
                    <label for="password">Enter Password Here:</label>
                    <input type="password" id="password" placeholder="Required">
                </div>
                
                <div class="input-group">
                    <label for="confirmpasswd">Confirm Password Here:</label>
                    <input type="password" id="confirmpasswd" placeholder="Required">
                </div>
                
                <input type="submit" value="COMPLETE REGISTRATION" class="futuristic-button">
            </form>
        </div>
    </div>
    
    <div class="support-footer">
        <hr>
        <h3>Our tech support cat is currently on standby.</h3>
        <img src="./images/IMG_2179.PNG" alt="Danger the tech support cat." class="danger">
    </div>

</body>
</html>
